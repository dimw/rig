<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">rig architecture</title>
  <desc id="desc">Your machine, CI/CD, or control plane runs the rig CLI. SSH/HTTPS reaches VMs through the firewall; HTTPS reaches the cloud provider. Environments can be created and disposed anytime. Object storage holds env state for the CLI; snapshots reuse boots.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>

  <!-- Your machine / CI/CD / control plane -->
  <rect x="24" y="24" width="412" height="372" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="48" y="52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#4338ca">YOUR MACHINE · CI/CD · CONTROL PLANE</text>

  <rect x="48" y="84" width="172" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.25"/>
  <text x="134" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Project</text>
  <text x="134" y="138" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">rig.yml · .rig/</text>

  <rect x="240" y="84" width="172" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.25"/>
  <text x="326" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Credentials</text>
  <text x="326" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">cloud · vault · SSH · S3</text>

  <path d="M134 160 V204" fill="none" stroke="#94a3b8" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M326 160 V204" fill="none" stroke="#94a3b8" stroke-width="1.75" marker-end="url(#arrow)"/>

  <rect x="96" y="204" width="268" height="100" rx="16" fill="#312e81"/>
  <text x="230" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">rig CLI</text>
  <text x="230" y="276" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c7d2fe">create · apply · destroy</text>
  <text x="230" y="294" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a5b4fc">attach · dev</text>

  <!-- Cloud provider -->
  <rect x="524" y="24" width="412" height="372" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="548" y="56" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#047857">CLOUD PROVIDER</text>

  <!-- Firewall: same vertical span as VM (y=68, h=168) -->
  <rect x="548" y="68" width="112" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.25"/>
  <text x="604" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Firewall</text>
  <text x="604" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">your IP</text>

  <rect x="688" y="68" width="224" height="168" rx="14" fill="#ffffff" stroke="#5eead4" stroke-width="1.75"/>
  <text x="800" y="92" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#0f766e">VMs</text>

  <rect x="708" y="106" width="184" height="48" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="800" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#0f766e">/workspace</text>
  <text x="800" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">your projects</text>

  <rect x="708" y="166" width="86" height="52" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="751" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#065f46">Agent</text>
  <text x="751" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">attach</text>

  <rect x="806" y="166" width="86" height="52" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="849" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#065f46">Editor</text>
  <text x="849" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">dev</text>

  <!-- Firewall → VM -->
  <path d="M660 152 H688" fill="none" stroke="#94a3b8" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- SSH/HTTPS first: CLI → center of Firewall (separate from Firewall → VM) -->
  <path d="M364 236 H480 V152 H548" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="424" y="226" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0d9488">SSH/HTTPS</text>

  <!-- HTTPS second: CLI → cloud provider -->
  <path d="M364 268 H524" fill="none" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
  <text x="444" y="288" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#6366f1">HTTPS</text>

  <rect x="548" y="262" width="176" height="112" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="572" cy="286" r="5" fill="#f59e0b"/>
  <text x="588" y="290" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Snapshots</text>
  <text x="564" y="318" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">reuse system /</text>
  <text x="564" y="334" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">workspace boots</text>
  <text x="564" y="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">on next create</text>

  <rect x="736" y="262" width="176" height="112" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="760" cy="286" r="5" fill="#0ea5e9"/>
  <text x="776" y="290" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Object storage</text>
  <text x="752" y="318" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">S3-compatible</text>
  <text x="752" y="334" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">backend for</text>
  <text x="752" y="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">remote env state</text>
</svg>
